name: Feature Request
description: Suggest an improvement or a new capability for FreeCut.
title: '[Feature]: '
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea. Explain the editing problem first so the request is easy to evaluate.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to accomplish, and what makes it difficult today?
      placeholder: Describe the workflow, limitation, or unmet need.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you would like FreeCut to address the problem.
      placeholder: Explain the behavior or experience you have in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Share any workarounds or other approaches you have tried.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, examples, links, or other details that clarify the request.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a similar request.
          required: true
